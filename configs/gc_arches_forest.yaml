# GC preset from a forest clearing (same sky as gc_arches.yaml).
scenario:
  mode: gc
  lat_deg: 40.0
  hour_angle_deg: -60.0
  sun: {enabled: true, ecliptic_longitude_deg: 180.0}
starfield: {seed: 1, r_res_pc: 25.0}
galaxy: {enabled: true, nside: 256, use_gas: true}
atmosphere: earth_clear
foreground: {type: forest, seed: 2, tree_density: 1.0, albedo_set: summer}
foreground_render: {spp: 64, n_lights: 32}
views:
  - {name: toward_nsc, kind: perspective, width: 1920, height: 1080, fov_deg: 70.0,
     azimuth_deg: auto, pitch_deg: auto, target: sgr_a_star, horizon_frac: 0.25}
  - {name: allsky, kind: allsky, width: 1024, height: 1024}
camera: {mode: eye}
